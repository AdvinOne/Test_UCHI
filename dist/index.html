<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7f6ce9">
  <title>Контрольная работа — математика, 3 класс</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="access.css">
  <script src="math-data.js" defer></script>
  <script src="access-state.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="access-loading" class="loading-message" role="status">Открываем контрольную…</div>
  <main class="exercise" id="exercise" hidden>
    <a class="back-to-course" id="back-to-course" href="course.html?subject=math&amp;work=2">‹ К контрольным работам</a>
    <p class="account-line" id="account-line"></p>
    <header class="exercise-header">
      <div class="progress" role="progressbar" aria-label="Пройдено заданий" aria-valuemin="0" aria-valuemax="11" aria-valuenow="0"><div class="progress-fill"></div></div>
      <p class="counter" id="counter"></p>
    </header>
    <section class="content" aria-labelledby="title">
      <h1 id="title" tabindex="-1"></h1>
      <p class="condition" id="condition" hidden></p>
      <form id="answers" autocomplete="off" novalidate></form>
      <p class="sr-only" id="feedback" role="status" aria-live="polite"></p>
    </section>
    <footer class="exercise-footer"><button class="main-button" id="continue" type="button" disabled>Готово</button></footer>
  </main>
</body>
</html>
