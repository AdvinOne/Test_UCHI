<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7f6ce9">
  <title>Контрольная работа — построй свой дом</title>
  <link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="work.css">
  <script src="../../math-data.js" defer></script><script src="work-engine.js" defer></script><script src="work.js" defer></script>
</head>
<body>
  <main class="exercise tower-exercise">
    <nav class="work-navigation" aria-label="Навигация">
      <a class="back-to-course" href="course.html?subject=math&amp;work=2">‹ К контрольным работам</a>
      <button class="city-link" id="city-toggle" aria-pressed="false">Мой город <span id="city-count">0</span></button>
    </nav>
    <div id="work-view">
      <header class="exercise-header">
        <div class="progress" role="progressbar" aria-label="Пройдено заданий" aria-valuemin="0" aria-valuemax="11" aria-valuenow="0"><div class="progress-fill"></div></div>
        <p class="counter" id="counter"></p>
      </header>
      <div class="work-layout">
        <div class="task-area">
          <section class="content" aria-labelledby="title">
            <h1 id="title" tabindex="-1"></h1><p class="condition" id="condition" hidden></p>
            <form id="answers" autocomplete="off" novalidate></form>
            <p class="sr-only" id="feedback" role="status" aria-live="polite"></p>
          </section>
          <footer class="exercise-footer"><button class="main-button" id="continue" type="button" disabled>Готово</button></footer>
        </div>
        <aside class="building-panel" aria-labelledby="building-title">
          <div class="building-heading"><h2 id="building-title">Твой дом</h2><span id="floor-count">0 из 11 этажей</span></div>
          <div class="building-scene" id="building-scene">
            <svg id="tower-scene" viewBox="0 0 300 440" role="img" aria-label="Место для будущего дома"></svg>
          </div>
          <p id="building-caption" class="building-caption">Решай задания — строй свой дом.<br>Один ответ на задание — один этаж.</p>
        </aside>
      </div>
      <p class="storage-note" id="storage-note" role="status" hidden>Прогресс сохраняется только пока открыта страница.</p>
    </div>
    <section id="city-view" class="city-view" aria-labelledby="city-title" hidden>
      <h1 id="city-title" tabindex="-1">Мой город</h1><p class="city-description">Каждая пройденная контрольная — новый дом.</p>
      <div class="city-world"><div class="city-houses" id="city-houses"></div><p id="empty-city">Здесь появится твой первый дом.<br>Для него нужно пройти контрольную.</p></div>
      <div class="city-footer"><p id="city-summary" role="status"></p><button id="back-to-work" class="main-button">К заданиям</button></div>
    </section>
  </main>
</body>
</html>
